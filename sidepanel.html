<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loopra</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --accent2: #f5a623;
      --text: #eaeaea;
      --text-muted: #888;
      --radius: 8px;
      --transition: 0.2s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      font-size: 13px;
    }

    /* ---- Status ---- */
    #status-bar {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; flex-shrink: 0; }
    #status-dot.connected { background: #4caf50; }
    #status-dot.error { background: var(--accent); }
    .lang-select {
      margin-left: auto;
      background: var(--surface2);
      color: var(--text);
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
    }

    /* ---- Warning ---- */
    #warning-bar {
      background: #3a2500;
      border: 1px solid var(--accent2);
      border-radius: var(--radius);
      padding: 7px 10px;
      margin-bottom: 10px;
      font-size: 11px;
      color: var(--accent2);
      display: none;
      align-items: center;
      gap: 8px;
    }
    #warning-bar.visible { display: flex; }
    #warning-text { flex: 1; }
    #warning-close { background: none; border: none; color: var(--accent2); font-size: 15px; cursor: pointer; padding: 0; line-height: 1; }

    /* ---- Song title ---- */
    .song-title-wrapper { overflow: hidden; width: 100%; margin-bottom: 12px; }
    #song-title-track { display: inline-flex; white-space: nowrap; will-change: transform; }
    .song-title { display: inline-block; white-space: nowrap; font-size: 15px; font-weight: 700; color: var(--text); line-height: 1.3; flex-shrink: 0; }

    /* ---- Sections ---- */
    .section { background: var(--surface); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
    .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .section-hint { font-size: 10px; color: var(--accent2); margin-bottom: 8px; display: none; }
    .section-hint.visible { display: block; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; cursor: pointer; }
    #speed-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 16px; background: transparent; outline: none; cursor: pointer;
    }
    #speed-slider::-webkit-slider-runnable-track {
      height: 4px; background: var(--surface2); border-radius: 2px;
    }
    #speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--text-muted); margin-top: -6px; cursor: pointer;
      transition: background var(--transition);
    }
    #speed-slider::-webkit-slider-thumb:hover { background: var(--text); }

    /* ---- Controls ---- */
    .controls { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 10px; }
    button { cursor: pointer; border: none; border-radius: var(--radius); font-size: 13px; transition: background var(--transition), transform var(--transition); }
    button:active { transform: scale(0.95); }
    .btn-primary { background: var(--accent); color: white; padding: 8px 18px; font-weight: 600; }
    .btn-primary:hover { background: #c73652; }
    .btn-secondary { background: var(--surface2); color: var(--text); padding: 8px 14px; }
    .btn-secondary:hover { background: #1a4a80; }
    .btn-small { background: var(--surface2); color: var(--text); padding: 5px 10px; font-size: 11px; }
    .btn-small:hover { background: #1a4a80; }
    .btn-danger { background: #3a1a1a; color: var(--accent); padding: 5px 10px; font-size: 11px; }
    .btn-danger:hover { background: #5a2020; }

    /* ---- Speed ---- */
    .speed-row { display: flex; align-items: center; gap: 8px; }
    .speed-row input[type="range"] { flex: 1; }
    .speed-value { font-size: 13px; font-weight: 700; min-width: 38px; text-align: right; color: var(--accent2); }
    .speed-presets { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }

    /* ---- Loop ---- */
    .loop-points { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .loop-point { background: var(--bg); border-radius: 6px; padding: 8px; }
    .loop-point-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .loop-point-time {
      display: inline-flex; align-items: baseline;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px; margin-left: -4px;
    }
    .time-sec {
      font-size: 16px; font-weight: 700; color: var(--accent2);
      cursor: ns-resize; user-select: none;
      border-radius: 4px; padding: 2px 0 2px 3px;
      transition: background var(--transition);
    }
    .time-dec {
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      cursor: ns-resize; user-select: none;
      border-radius: 4px; padding: 2px 3px 2px 1px;
      transition: background var(--transition);
    }
    .time-sec:hover, .time-dec:hover { background: rgba(255,255,255,0.07); }
    .time-sec:focus, .time-dec:focus { outline: 1px solid var(--accent2); outline-offset: 1px; }
    .loop-active { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

    /* toggle */
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { display: none; }
    .toggle-track { position: absolute; inset: 0; background: #444; border-radius: 20px; cursor: pointer; transition: background var(--transition); }
    .toggle input:checked + .toggle-track { background: var(--accent); }
    .toggle-thumb { position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; background: white; border-radius: 50%; transition: transform var(--transition); pointer-events: none; }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

    /* ---- Saved loops ---- */
    .saved-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
    .saved-item { background: var(--bg); border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; transition: background var(--transition); }
    .saved-item:hover { background: #0d1b35; }
    .saved-item-info { flex: 1; min-width: 0; }
    .saved-item-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .saved-item-times { font-size: 10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .save-form { display: flex; gap: 6px; margin-top: 8px; }
    .save-form input[type="text"] { flex: 1; background: var(--bg); border: 1px solid #333; border-radius: 6px; color: var(--text); padding: 6px 8px; font-size: 12px; outline: none; }
    .save-form input[type="text"]:focus { border-color: var(--accent); }
    .empty-hint { font-size: 11px; color: var(--text-muted); text-align: center; padding: 10px 0; }
    #loop-active-label { font-size: 12px; color: var(--text-muted); }
    #loop-active-label.on { color: var(--accent); font-weight: 600; }

    /* ---- Edit form ---- */
    .edit-name-input { width: 100%; background: var(--surface); border: 1px solid #333; border-radius: 6px; color: var(--text); padding: 4px 6px; font-size: 12px; outline: none; margin-bottom: 5px; }
    .edit-name-input:focus { border-color: var(--accent); }
    .edit-points { display: flex; flex-direction: column; gap: 3px; }
    .edit-point-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .edit-point-label { color: var(--accent2); font-weight: 700; min-width: 12px; }
    .edit-point-time {
      color: var(--text); font-variant-numeric: tabular-nums; min-width: 38px;
      cursor: ns-resize; user-select: none;
      border-radius: 4px; padding: 1px 3px;
      transition: background var(--transition);
    }
    .edit-point-time:hover { background: rgba(255,255,255,0.07); }
    .edit-point-time:focus { outline: 1px solid var(--accent2); }

    /* ---- Edit A/B side-by-side ---- */
    .edit-ab-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .edit-ab-box { flex: 1; background: var(--bg); border-radius: 6px; padding: 6px 8px; text-align: center; }
    .edit-ab-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .edit-ab-arrow { font-size: 14px; color: var(--text-muted); flex-shrink: 0; }
    .edit-ab-times { display: inline-flex; align-items: baseline; justify-content: center; }
    .edit-ab-time {
      font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: var(--accent2);
      cursor: ns-resize; user-select: none;
      border-radius: 4px; padding: 2px 4px;
      transition: background var(--transition);
    }
    .edit-ab-time.time-dec { font-size: 11px; color: var(--text-muted); }
    .edit-ab-time:hover { background: rgba(255,255,255,0.07); }
    .edit-ab-time:focus { outline: 1px solid var(--accent2); outline-offset: 1px; }

    /* ---- Songs list ---- */
    .songs-list { display: flex; flex-direction: column; gap: 6px; }
    .song-item { background: var(--bg); border-radius: 6px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
    .song-item-info { flex: 1; min-width: 0; }
    .song-item-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-item-meta { font-size: 10px; color: var(--text-muted); }

    /* ---- Section header with action button ---- */
    .section-header { display: flex; align-items: center; margin-bottom: 8px; }
    .section-header .section-label { margin-bottom: 0; flex: 1; }

    /* ---- Editor Overlay ---- */
    #editor-overlay { display: none; position: fixed; inset: 0; z-index: 100; background: var(--bg); overflow-y: auto; padding: 16px; }
    #editor-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    #editor-header span { font-size: 14px; font-weight: 700; }
    .editor-card { background: var(--surface); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; position: relative; }
    .editor-card-top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .editor-card-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .editor-title-input, .editor-url-input {
      width: 100%; background: var(--bg); border: 1px solid #333; border-radius: 6px;
      color: var(--text); padding: 5px 8px; font-size: 12px; outline: none;
    }
    .editor-title-input { font-weight: 600; }
    .editor-url-input { color: var(--text-muted); }
    .editor-title-input:focus, .editor-url-input:focus { border-color: var(--accent); }
    .editor-del-song {
      background: none; border: none; color: var(--text-muted); font-size: 17px; cursor: pointer;
      padding: 2px 4px; border-radius: 4px; line-height: 1; flex-shrink: 0;
      transition: background var(--transition), color var(--transition);
    }
    .editor-del-song:hover { color: var(--accent); background: rgba(233,69,96,0.12); }
    .editor-loops-list { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    .editor-loop-row { display: flex; align-items: center; gap: 6px; }
    .editor-loop-name {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid #333; border-radius: 4px;
      color: var(--text); padding: 4px 7px; font-size: 12px; outline: none;
    }
    .editor-loop-a, .editor-loop-b {
      width: 62px; background: var(--bg); border: 1px solid #333; border-radius: 4px;
      color: var(--accent2); padding: 4px 5px; font-size: 12px; font-variant-numeric: tabular-nums;
      outline: none; text-align: center;
    }
    .editor-loop-name:focus, .editor-loop-a:focus, .editor-loop-b:focus { border-color: var(--accent); }
    .editor-loop-arrow { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
    .editor-card-footer { display: flex; justify-content: flex-end; }

    /* ---- A-B Loop Bar ---- */
    .loop-bar-wrap { margin-bottom: 12px; user-select: none; -webkit-user-select: none; }
    .loop-bar-track {
      position: relative;
      height: 14px;
      background: var(--bg);
      border-radius: 7px;
      cursor: pointer;
    }
    .loop-bar-range {
      position: absolute;
      top: 0; bottom: 0;
      background: rgba(245, 166, 35, 0.3);
      border-radius: 4px;
      pointer-events: none;
      display: none;
    }
    .loop-bar-playhead {
      position: absolute;
      top: -4px; bottom: -4px;
      width: 2px;
      background: var(--text);
      border-radius: 2px;
      transform: translateX(-50%);
      cursor: col-resize;
      left: 0;
    }
    .loop-bar-handle {
      position: absolute;
      top: -6px; bottom: -6px;
      width: 18px;
      transform: translateX(-50%);
      cursor: col-resize;
      display: none;
      z-index: 2;
    }
    .loop-bar-handle::before {
      content: "";
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 3px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: var(--handle-color, var(--accent2));
    }
    .loop-bar-handle:hover::before { opacity: 0.8; }
    .loop-bar-labels {
      position: relative;
      height: 14px;
      margin-top: 8px;
      pointer-events: none;
    }
    .loop-bar-label {
      position: absolute;
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      transform: translateX(-50%);
      display: none;
      white-space: nowrap;
    }
    #loop-bar-label-a { color: color-mix(in srgb, var(--accent) 80%, var(--text-muted)); }
    #loop-bar-label-b { color: color-mix(in srgb, var(--accent2) 80%, var(--text-muted)); }

    /* ---- Saved item color bar ---- */
    .saved-item-color-bar { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
    .saved-item.active { background: rgba(255,255,255,0.06); outline: 1px solid rgba(255,255,255,0.12); }

    /* ---- Color picker (editor) ---- */
    .editor-loop-wrap { margin-bottom: 6px; }
    .color-picker { display: flex; gap: 4px; padding: 4px 0 0; }
    .color-dot {
      width: 13px; height: 13px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; box-sizing: border-box;
      transition: border-color 0.1s, transform 0.1s;
    }
    .color-dot:hover { transform: scale(1.2); }
    .color-dot.selected { border-color: rgba(255,255,255,0.85); }

    /* ---- Editor save button state ---- */
    .editor-save-btn { color: var(--text-muted); }
    .editor-save-btn.dirty { background: var(--accent); color: white; font-weight: 600; }

    /* ---- Color hex input ---- */
    .color-hex-input {
      flex-shrink: 0; width: 68px; background: var(--bg); border: 1px solid #333; border-radius: 4px;
      color: var(--text); padding: 2px 5px; font-size: 11px; font-family: monospace; outline: none;
    }
    .color-hex-input:focus { border-color: var(--accent); }

    /* ---- Editor loop right column (A→B + color picker stacked) ---- */
    .editor-loop-right { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .editor-loop-ab { display: flex; align-items: center; gap: 6px; }
    .editor-loop-right .color-picker { padding-top: 0; justify-content: flex-end; }

  </style>
</head>
<body>

<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-text">未接続</span>
  <select id="lang-select" class="lang-select">
    <option value="ja">日本語</option>
    <option value="en">English</option>
  </select>
</div>

<div class="song-title-wrapper" id="song-title-wrapper">
  <div id="song-title-track">
    <span class="song-title" id="song-title">YouTube Musicを開いてください</span>
    <span class="song-title" id="song-title-clone" aria-hidden="true" style="display:none"></span>
  </div>
</div>

<!-- 再生速度 -->
<div class="section">
  <div class="section-label" data-i18n="labelSpeed">再生速度</div>
  <div class="speed-row">
    <input type="range" id="speed-slider" min="0.5" max="1.5" step="0.05" value="1.0">
    <div class="speed-value" id="speed-value">1.00×</div>
  </div>
  <div class="speed-presets">
    <button class="btn-small" data-speed="0.5">0.5×</button>
    <button class="btn-small" data-speed="0.75">0.75×</button>
    <button class="btn-small" data-speed="1.0">1.0×</button>
    <button class="btn-small" data-speed="1.25">1.25×</button>
    <button class="btn-small" data-speed="1.5">1.5×</button>
  </div>
</div>

<!-- 再生位置 -->
<div class="section">
  <div class="section-label" data-i18n="labelPosition">Timeline</div>
  <div class="time-display">
    <span id="current-time">0:00</span>
    <span id="duration">0:00</span>
  </div>
  <div class="loop-bar-wrap">
    <div class="loop-bar-track" id="loop-bar-track">
      <div class="loop-bar-range" id="loop-bar-range"></div>
      <div class="loop-bar-playhead" id="loop-bar-playhead"></div>
      <div class="loop-bar-handle" id="loop-bar-handle-a"></div>
      <div class="loop-bar-handle" id="loop-bar-handle-b"></div>
    </div>
    <div class="loop-bar-labels">
      <span class="loop-bar-label" id="loop-bar-label-a"></span>
      <span class="loop-bar-label" id="loop-bar-label-b"></span>
    </div>
  </div>
  <div class="controls">
    <button class="btn-secondary" id="btn-back5" data-i18n="btnBack">« 5秒</button>
    <button class="btn-primary" id="btn-play" data-i18n="btnPlay">▶ 再生</button>
    <button class="btn-secondary" id="btn-fwd5" data-i18n="btnFwd">5秒 »</button>
  </div>
</div>

<!-- A-Bループ -->
<div class="section">
  <div class="section-label" data-i18n="labelLoop">A-Bループ</div>
  <div id="warning-bar">
    <span id="warning-text"></span>
    <button id="warning-close">×</button>
  </div>
  <div class="loop-points">
    <div class="loop-point">
      <div class="loop-point-label" data-i18n="loopALabel">▶ A点（開始）</div>
      <div class="loop-point-time" id="loop-a-display">
        <span class="time-sec" id="loop-a-sec" tabindex="0">--:--</span><span class="time-dec" id="loop-a-dec" tabindex="0">.-</span>
      </div>
      <button class="btn-small" id="btn-set-a" data-i18n="btnSetA">現在位置をセット</button>
    </div>
    <div class="loop-point">
      <div class="loop-point-label" data-i18n="loopBLabel">■ B点（終了）</div>
      <div class="loop-point-time" id="loop-b-display">
        <span class="time-sec" id="loop-b-sec" tabindex="0">--:--</span><span class="time-dec" id="loop-b-dec" tabindex="0">.-</span>
      </div>
      <button class="btn-small" id="btn-set-b" data-i18n="btnSetB">現在位置をセット</button>
    </div>
  </div>
  <div class="loop-active">
    <label class="toggle">
      <input type="checkbox" id="loop-toggle">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
    <span id="loop-active-label" data-i18n="loopOff">ループ OFF</span>
    <button class="btn-small" id="btn-clear-loop" style="margin-left:auto" data-i18n="btnClear">クリア</button>
  </div>
</div>

<!-- 保存済みループ -->
<div class="section">
  <div class="section-label" data-i18n="labelSaved">保存済みループ</div>
  <div class="section-hint" id="saved-loops-hint">
    <button class="btn-small" id="btn-fetch-title" data-i18n="btnFetchTitle">曲名を取得</button>
    <div id="saved-loops-reload-hint" style="display:none; margin-top:5px; font-size:10px; color:var(--text-muted);" data-i18n="hintReload"></div>
  </div>
  <div class="save-form">
    <input type="text" id="loop-name-input" data-i18n-placeholder="loopNamePlaceholder" placeholder="ループ名（例: サビ前半）" maxlength="30">
    <button class="btn-small" id="btn-save-loop" data-i18n="btnSave">保存</button>
  </div>
  <div class="saved-list" id="saved-list" style="margin-top:10px">
    <div class="empty-hint" id="empty-hint" data-i18n="emptyHint">保存済みのループはありません</div>
  </div>
</div>

<!-- 保存済みの曲 -->
<div class="section">
  <div class="section-header">
    <div class="section-label" data-i18n="labelAllSongs">保存済みの曲</div>
    <button id="btn-editor-open" class="btn-small" data-i18n="btnOpenEditor">編集エディタを開く</button>
  </div>
  <div class="songs-list" id="songs-list">
    <div class="empty-hint" data-i18n="emptyAllSongs">保存済みの曲はありません</div>
  </div>
</div>


<!-- Data Editor Overlay -->
<div id="editor-overlay">
  <div id="editor-header">
    <button class="btn-secondary" id="btn-editor-close" data-i18n="btnEditorClose">← 戻る</button>
    <span data-i18n="labelEditor">データエディタ</span>
  </div>
  <div id="editor-songs-list"></div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
